name: Full tests

# The whole suite: every test class, the tool tests and the evidence seals.
# Not run on PRs. Start it from the Actions tab (Run workflow) on any branch.
# Tick "balance only" to run just the balance and calibration tests ([Trait("Kind", "Balance")]):
# rate bands, seed sweeps, cohorts and pinned tuned numbers.
on:
  workflow_dispatch:
    inputs:
      balance_only:
        description: Run only the balance and calibration tests (Kind=Balance)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  full:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      # Balance only: the Kind=Balance tests and nothing else. MaxParallelThreads=0 overrides the half-the-cores
      # cap in xunit.runner.json, which is there for local runs.
      - name: Balance and calibration tests
        if: ${{ inputs.balance_only }}
        run: >-
          dotnet test src/GrandSluggers.Sim.Tests/GrandSluggers.Sim.Tests.csproj -c Release
          --filter "Kind=Balance"
          -- xUnit.MaxParallelThreads=0

      # Everything else below is the full run.
      - name: Install tooling shell
        if: ${{ !inputs.balance_only }}
        run: |
          sudo apt-get update
          sudo apt-get install --yes zsh
      - name: Every test
        if: ${{ !inputs.balance_only }}
        run: dotnet test src/GrandSluggers.Sim.Tests/GrandSluggers.Sim.Tests.csproj -- xUnit.MaxParallelThreads=0
      - name: Art catalog
        if: ${{ !inputs.balance_only }}
        run: dotnet run --project src/GrandSluggers.Cli -- art
      - name: Tutorials catalog
        if: ${{ !inputs.balance_only }}
        run: dotnet run --project src/GrandSluggers.Cli -- tutorials
      - name: Tool tests
        if: ${{ !inputs.balance_only }}
        run: python3 -m unittest discover -s tools/tests -p 'test_*.py'
      # Both research evidence files seal the sources they were derived from.
      # Refresh order matters: the compact-field report asserts the flight seals
      # inside derive(), so a stale flight file blocks it in either mode. Regenerate
      # with the probe's --write first, then run the report with no flag.
      - name: Flight evidence seals are current
        if: ${{ !inputs.balance_only }}
        run: dotnet run --project tools/game-feel-flight-probes -- --check
      - name: Compact field evidence seals are current
        if: ${{ !inputs.balance_only }}
        run: python3 tools/compact-field-report.py --check
