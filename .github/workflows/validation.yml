name: Validation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  portable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      # The PR check answers one question: does this change break the game? It builds everything and runs the
      # fast unit tests. The tutorial and scenario classes, the C80 re-run, the tool tests and the evidence seals
      # are slow; they run from the Actions tab on demand (full-tests.yml).
      - run: dotnet build src/GrandSluggers.Cli/GrandSluggers.Cli.csproj -c Release
      - run: >-
          dotnet test src/GrandSluggers.Sim.Tests/GrandSluggers.Sim.Tests.csproj -c Release
          --filter "FullyQualifiedName!~Tutorial&FullyQualifiedName!~Scenario"

  unity-project:
    if: vars.UNITY_VALIDATION_ENABLED == 'true'
    needs: portable
    runs-on: [self-hosted, macOS, grand-sluggers-unity]
    env:
      UNITY_EDITOR_BIN: ${{ vars.UNITY_EDITOR_BIN }}
      UNITY_EDITOR: ${{ vars.UNITY_EDITOR_ROOT }}
      GS_UNITY_BATCH_LICENSED: ${{ vars.GS_UNITY_BATCH_LICENSED }}
    steps:
      - uses: actions/checkout@v4
        with:
          clean: true
      - run: tools/unity-project-validate.sh
      - run: tools/unity-compile.sh
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unity-validation-${{ github.sha }}
          path: |
            unity/Temp/validation/unity-evidence.json
            unity/Temp/validation/unity.log
