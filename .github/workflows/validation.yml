name: Validation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # The one required check on main (a repository ruleset requires it; no bypass). There is no Unity job here:
  # the Personal license does not allow batch mode and the repository is public, so a self-hosted Unity runner
  # would run fork PRs on Jack's Mac. The Unity gates are local; see docs/validation.md.
  portable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      # The PR check answers one question: does this change break the game? It builds everything and runs the
      # breakage suite: every test not tagged [Trait("Kind", "Balance")]. Balance and calibration (rate bands,
      # seed sweeps, cohorts, pinned tuned numbers), the tool tests and the evidence seals run
      # on demand from the Actions tab (full-tests.yml). xunit.runner.json caps local runs at half the cores;
      # MaxParallelThreads=0 gives CI the default, one thread per core.
      - run: dotnet build src/GrandSluggers.Cli/GrandSluggers.Cli.csproj -c Release
      - run: >-
          dotnet test src/GrandSluggers.Sim.Tests/GrandSluggers.Sim.Tests.csproj -c Release
          --filter "Kind!=Balance"
          -- xUnit.MaxParallelThreads=0
