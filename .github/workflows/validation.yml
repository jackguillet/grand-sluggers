name: Validation

on:
  # labeled / unlabeled re-run the checks when an author adds an override label (book-unchanged).
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main]

permissions:
  contents: read

# A new push to a PR cancels that PR's older run; runs on main always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The one required check on main (a repository ruleset requires it; no bypass). There is no Unity job here:
  # the Personal license does not allow batch mode and the repository is public, so a self-hosted Unity runner
  # would run fork PRs on Jack's Mac. The Unity gates are local; see docs/validation.md.
  portable:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Depth 2: a PR checks out its merge commit, so HEAD^1 is the base and HEAD^1..HEAD is the change.
      - uses: actions/checkout@v7
        with:
          lfs: true
          fetch-depth: 2
      # An added spec line says what the game does, never who built it or when (AGENTS.md).
      - name: Spec provenance
        run: python3 tools/spec-provenance.py
      # AGENTS.md "Rails, not patches": docs/how-to-play.md and HowToPlay change together (override: book-unchanged).
      - name: Book pair
        if: github.event_name == 'pull_request'
        env:
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: python3 tools/book-pair.py
      # AGENTS.md "Art": no Nintendo names in data, art, the book or couch copy.
      - name: Original IP
        run: python3 tools/original_ip.py
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      # The PR check answers one question: does this change break the game? It builds every project, runs the
      # breakage suite (every test not tagged [Trait("Kind", "Balance")]), validates the art and tutorial
      # catalogs, and runs the tool tests. Balance and calibration (rate bands, seed sweeps, cohorts, pinned
      # tuned numbers) and the evidence seals run on demand from the Actions tab (full-tests.yml).
      # xunit.runner.json caps local runs at half the cores; MaxParallelThreads=0 gives CI one thread per core.
      - name: Build every project
        run: dotnet build GrandSluggers.sln -c Release
      # The research probes under tools/ are outside the solution. Build them so a rule-table change that breaks
      # one fails here. Build only: their evidence checks run on demand, not on a PR.
      - name: Build the tools/ probes
        run: for p in tools/*/*.csproj; do dotnet build "$p" -c Release || exit 1; done
      - name: Breakage suite
        run: >-
          dotnet test src/GrandSluggers.Sim.Tests/GrandSluggers.Sim.Tests.csproj -c Release --no-build
          --filter "Kind!=Balance"
          -- xUnit.MaxParallelThreads=0
      - name: Art catalog, debug protocol, dual stills and DCC stages
        run: dotnet run --project src/GrandSluggers.Cli -c Release --no-build -- art
      - name: Tutorials catalog
        run: dotnet run --project src/GrandSluggers.Cli -c Release --no-build -- tutorials
      # Delivery (local-player.py), the GUI Unity lock and the still tools. Two tests drive zsh scripts.
      - name: Install tooling shell
        run: sudo apt-get update -qq && sudo apt-get install --yes --no-install-recommends zsh
      - name: Tool tests
        run: python3 -m unittest discover -s tools/tests -p 'test_*.py'
