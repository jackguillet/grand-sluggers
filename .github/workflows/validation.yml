name: Validation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  portable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      # The PR check answers one question: does this change break the game? It builds everything and runs the
      # breakage suite: every test not tagged [Trait("Kind", "Balance")]. Balance and calibration (rate bands,
      # seed sweeps, cohorts, pinned tuned numbers), the tool tests and the evidence seals run
      # on demand from the Actions tab (full-tests.yml). xunit.runner.json caps local runs at half the cores;
      # MaxParallelThreads=0 gives CI the default, one thread per core.
      - run: dotnet build src/GrandSluggers.Cli/GrandSluggers.Cli.csproj -c Release
      - run: >-
          dotnet test src/GrandSluggers.Sim.Tests/GrandSluggers.Sim.Tests.csproj -c Release
          --filter "Kind!=Balance"
          -- xUnit.MaxParallelThreads=0

  unity-project:
    if: vars.UNITY_VALIDATION_ENABLED == 'true'
    needs: portable
    runs-on: [self-hosted, macOS, grand-sluggers-unity]
    env:
      UNITY_EDITOR_BIN: ${{ vars.UNITY_EDITOR_BIN }}
      UNITY_EDITOR: ${{ vars.UNITY_EDITOR_ROOT }}
      GS_UNITY_BATCH_LICENSED: ${{ vars.GS_UNITY_BATCH_LICENSED }}
    steps:
      - uses: actions/checkout@v7
        with:
          clean: true
      - run: tools/unity-project-validate.sh
      - run: tools/unity-compile.sh
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unity-validation-${{ github.sha }}
          path: |
            unity/Temp/validation/unity-evidence.json
            unity/Temp/validation/unity.log
